name: Build and deploy ASP.Net Core app to an Azure Web App

env:
  AZURE_WEBAPP_NAME: TaskManagerWeb
  AZURE_WEBAPP_PACKAGE_PATH: 'TasksApi'
  DOTNET_VERSION: '10.0'

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Build
        run: dotnet build "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}" --configuration Release

      - name: Publish
        run: dotnet publish "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}" -c Release -o "${{ github.workspace }}/published"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ github.workspace }}/published

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
